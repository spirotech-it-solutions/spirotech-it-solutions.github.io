<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Cyan Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Orbital Gradient -->
    <linearGradient id="orbit-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="50%" stop-color="#00aaff"/>
      <stop offset="100%" stop-color="#0044ff"/>
    </linearGradient>

    <linearGradient id="orbit-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bg-grad)" rx="30"/>

  <!-- Center Group -->
  <g transform="translate(250, 195)">
    
    <!-- Back Orbital Ring -->
    <path d="M -110,25 C -50,60 50,60 110,25" fill="none" stroke="url(#orbit-grad-1)" stroke-width="2.5" opacity="0.4" stroke-dasharray="4 4"/>

    <!-- Dotted Sphere Matrix (Simulated 3D Globe) -->
    <!-- Row 1 (Top) -->
    <circle cx="0" cy="-75" r="2" fill="#00ffff" opacity="0.4"/>
    
    <!-- Row 2 -->
    <circle cx="-25" cy="-55" r="2.5" fill="#00ffff" opacity="0.6"/>
    <circle cx="0" cy="-55" r="3" fill="#00ffff" opacity="0.8"/>
    <circle cx="25" cy="-55" r="2.5" fill="#00aaff" opacity="0.6"/>

    <!-- Row 3 -->
    <circle cx="-50" cy="-30" r="3" fill="#00aaff" opacity="0.5"/>
    <circle cx="-25" cy="-30" r="3.5" fill="#00ffff" opacity="0.9"/>
    <circle cx="0" cy="-30" r="4" fill="#00ffff" filter="url(#glow)"/>
    <circle cx="25" cy="-30" r="3.5" fill="#00ffff" opacity="0.9"/>
    <circle cx="50" cy="-30" r="3" fill="#00aaff" opacity="0.5"/>

    <!-- Row 4 (Equator) -->
    <circle cx="-70" cy="0" r="2.5" fill="#0044ff" opacity="0.4"/>
    <circle cx="-45" cy="0" r="3.5" fill="#00aaff" opacity="0.7"/>
    <circle cx="-20" cy="0" r="4.5" fill="#00ffff" opacity="0.95"/>
    <circle cx="5" cy="0" r="5" fill="#00ffff" filter="url(#glow)"/>
    <circle cx="30" cy="0" r="4" fill="#00ffff" opacity="0.85"/>
    <circle cx="55" cy="0" r="3" fill="#00aaff" opacity="0.6"/>
    <circle cx="75" cy="0" r="2" fill="#0044ff" opacity="0.3"/>

    <!-- Row 5 -->
    <circle cx="-55" cy="30" r="3" fill="#0022aa" opacity="0.4"/>
    <circle cx="-30" cy="30" r="3.5" fill="#0080ff" opacity="0.7"/>
    <circle cx="-5" cy="30" r="4" fill="#00aaff" opacity="0.9"/>
    <circle cx="20" cy="30" r="3.5" fill="#00ffff" opacity="0.8"/>
    <circle cx="45" cy="30" r="3" fill="#00aaff" opacity="0.6"/>

    <!-- Row 6 -->
    <circle cx="-30" cy="55" r="2.5" fill="#001155" opacity="0.3"/>
    <circle cx="-5" cy="55" r="3" fill="#0044ff" opacity="0.6"/>
    <circle cx="20" cy="55" r="2.5" fill="#0080ff" opacity="0.5"/>

    <!-- Row 7 (Bottom) -->
    <circle cx="0" cy="75" r="2" fill="#001155" opacity="0.3"/>

    <!-- Primary Front Orbital Ring (Dynamic Swoosh) -->
    <path d="M -130,-10 C -60,-55 60,-55 130,-10 C 70,35 -70,35 -130,-10 Z" fill="url(#orbit-grad-2)" opacity="0.2" filter="url(#glow)"/>
    <path d="M -125,-12 C -55,-50 55,-50 125,-12" fill="none" stroke="url(#orbit-grad-1)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
    
    <!-- Secondary Lower Orbital Ring -->
    <path d="M -100,20 C -40,55 40,55 100,20" fill="none" stroke="url(#orbit-grad-2)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Typography Section -->
  <g text-anchor="middle">
    <!-- SPIROTECH IT -->
    <text x="250" y="365" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="34" letter-spacing="8" fill="url(#text-grad)">SPIROTECH IT</text>
    
    <!-- SOLUTIONS -->
    <text x="250" y="402" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="400" font-size="16" letter-spacing="14" fill="#a5b4fc" opacity="0.9">SOLUTIONS</text>
  </g>
</svg>
